<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口放行 · portknock</title>
<style>
  :root {
    --bg0:#0b1020; --bg1:#131a35; --card:rgba(255,255,255,.055); --card-br:rgba(255,255,255,.1);
    --fg:#eef1f8; --muted:#9aa4c4; --accent:#6d8cff; --accent2:#8b5cf6;
    --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --ring:rgba(109,140,255,.5);
    --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.6; display:grid; place-items:center; padding:2rem 1.25rem;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(109,140,255,.22), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    background-attachment:fixed;
  }
  .wrap { width:100%; max-width:480px; }
  .brand { display:flex; align-items:center; gap:.6rem; justify-content:center; margin-bottom:1.5rem;
    font-weight:650; letter-spacing:.3px; }
  .brand svg { width:26px; height:26px; }
  .brand .name { font-size:1.05rem; }
  .brand .dot { color:var(--muted); font-weight:400; }
  .card {
    background:var(--card); border:1px solid var(--card-br); border-radius:20px;
    padding:1.9rem 1.9rem 2rem; backdrop-filter:blur(14px); box-shadow:var(--shadow);
  }
  h1 { font-size:1.35rem; margin:0 0 .4rem; letter-spacing:.2px; }
  .sub { color:var(--muted); margin:0 0 1.5rem; font-size:.95rem; }
  .iplabel { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; margin-bottom:.35rem; }
  .ipbox {
    display:flex; align-items:center; gap:.6rem; font-family:ui-monospace,"SF Mono",monospace;
    font-size:1.55rem; font-weight:700; font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.04); border:1px solid var(--card-br); border-radius:14px;
    padding:.85rem 1.1rem; margin-bottom:1.5rem;
  }
  .ipbox .pin { width:20px; height:20px; color:var(--accent); flex:none; }
  .portlabel { color:var(--muted); font-size:.9rem; margin-bottom:.6rem; }
  .ports { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.75rem; }
  .port {
    font-family:ui-monospace,monospace; font-size:.9rem; font-weight:600;
    padding:.3rem .7rem; border-radius:999px; color:var(--fg);
    background:linear-gradient(135deg, rgba(109,140,255,.22), rgba(139,92,246,.22));
    border:1px solid rgba(139,92,246,.35);
  }
  .pass {
    width:100%; box-sizing:border-box; padding:.75rem .9rem; font-size:1rem; color:var(--fg);
    background:rgba(255,255,255,.05); border:1px solid var(--card-br); border-radius:12px;
    margin-bottom:.8rem; outline:none;
  }
  .pass:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
  .err {
    display:flex; gap:.5rem; align-items:center; color:#fecaca; background:rgba(248,113,113,.12);
    border:1px solid rgba(248,113,113,.4); border-radius:12px; padding:.6rem .8rem;
    margin-bottom:1rem; font-size:.9rem;
  }
  .err svg { width:18px; height:18px; flex:none; }
  .btn {
    width:100%; font-size:1.02rem; font-weight:650; padding:.9rem 1.4rem; border:0; border-radius:13px;
    color:#fff; cursor:pointer; letter-spacing:.3px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 10px 30px -10px var(--ring); transition:transform .08s ease, box-shadow .2s ease;
  }
  .btn:hover { box-shadow:0 14px 36px -10px var(--ring); transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .ok {
    display:flex; gap:.6rem; align-items:flex-start; background:var(--ok-bg);
    border:1px solid rgba(52,211,153,.4); color:#d1fae5; border-radius:14px;
    padding:.85rem 1rem; margin-bottom:1.5rem; font-size:.92rem;
  }
  .ok svg { width:20px; height:20px; color:var(--ok); flex:none; margin-top:1px; }
  .empty { color:var(--muted); background:rgba(255,255,255,.04); border:1px dashed var(--card-br);
    border-radius:14px; padding:1rem; text-align:center; font-size:.92rem; }
  .foot { text-align:center; color:var(--muted); font-size:.8rem; margin-top:1.1rem; }
  .foot a { color:var(--accent); text-decoration:none; }
  .foot a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 4.4-3 7.9-7 9-4-1.1-7-4.6-7-9V5l7-3z" fill="url(#g)" stroke="rgba(255,255,255,.5)" stroke-width="1"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="5" y1="2" x2="19" y2="21"><stop stop-color="#6d8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
    <span class="name">portknock</span><span class="dot">· 端口放行</span>
  </div>

  <div class="card">
    <h1>申请端口访问</h1>
    <p class="sub">确认后，你当前的 IP 将被加入防火墙白名单。</p>

    {{if .Granted}}
    <div class="ok">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>已放行成功。你的 IP 现可访问本机全部端口。<br>48 小时内若无连接记录将自动移除。</div>
    </div>
    {{end}}
    {{if eq .Error "password"}}
    <div class="err">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      口令错误，请重试。
    </div>
    {{end}}

    <div class="iplabel">检测到的来访 IP</div>
    <div class="ipbox">
      <svg class="pin" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-5.2-7-11a7 7 0 1114 0c0 5.8-7 11-7 11z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg>
      {{.ClientIP}}
    </div>

    <div class="portlabel">确认后，该 IP 将被放行访问本机<strong>全部端口</strong>。</div>
    <form method="post" action="/grant">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      {{if .NeedPass}}
      <input class="pass" type="password" name="password" placeholder="请输入放行口令" autocomplete="off" required>
      {{end}}
      <button class="btn" type="submit">放行我的 IP</button>
    </form>
  </div>
  <div class="foot">由 ufw 防火墙保护 · 规则空闲 48 小时自动回收 · <a href="/admin">管理员入口</a> · portknock {{.Version}}</div>
</div>
</body>
</html>
